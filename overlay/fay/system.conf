# Fay 容器运行配置（overlay：挂载到 /app/system.conf，只读）
#
# 为什么必须有这个文件：fay 仓库里 system.conf 不存在（上游 45b44e9 已把它
# 加入 .gitignore 并只留 system.conf.bak 模板），而 start.sh 依赖的远程配置中心
# http://1.12.69.110:5500 现已不可达。没有本地 system.conf，Fay 无法启动。
#
# 所有 AI 能力都指向宿主机 Ollama（host.docker.internal:11434），不使用任何云端 API key。
# 换模型 = 改本文件后 `docker compose restart fay`。

[key]
# ---------- ASR：容器无声卡，麦克风链路整体关闭（config.json 里 record.enabled=false）
# 保留 funasr 选项但不填密钥；ali 模式会要求阿里云密钥，故不选。
ASR_mode = funasr
local_asr_ip = host.docker.internal
local_asr_port = 10197
ali_nls_key_id =
ali_nls_key_secret =
ali_nls_app_key =

# ---------- TTS：取任意非 ali/gptsovits/gptsovits_v3/volcano 的值 → core/fay_core.py:103
# 落到 tts/ms_tts_sdk.py；其中 ms_tts_key 为空时走 edge_tts 免费通道。
tts_module = edge
ms_tts_key =
ms_tts_region =
ali_tss_key_id =
ali_tss_key_secret =
ali_tss_app_key =
volcano_tts_appid =
volcano_tts_access_token =
volcano_tts_cluster = volcano_tts
volcano_tts_voice_type =

# ---------- 小模型（日常对话 / 工具编排）：Ollama 的 OpenAI 兼容端点 /v1 ----------
gpt_api_key = ollama
gpt_base_url = http://host.docker.internal:11434/v1
gpt_model_engine = qwen3.5:9b

# ---------- 大模型（复杂推理；未配置则自动降级为小模型）----------
# 默认让小模型和大模型用同一个 qwen3.5:9b：本机 16GB 显存装得下它（权重 6.6GB），
# 一次问答能在 adapter 的 25s 超时内返回。
# 想真正启用大模型分档就改成 qwen3.8:27b（17.7GB 权重，会溢出到内存/CPU，
# 首个请求可能加载数分钟并触发超时），或直接把这三行留空走单模型降级。
big_model_engine = qwen3.5:9b
big_model_base_url = http://host.docker.internal:11434/v1
big_model_api_key = ollama

# ---------- Embedding：仿生记忆检索用；Ollama 原生 embeddings 端点 ----------
embedding_api_model = qwen3-embedding:0.6b
embedding_base_url = http://host.docker.internal:11434/v1

# 不需要代理访问 Ollama
proxy_config =

# ---------- 启动模式 ----------
# web = 服务器/容器模式（utils/config_util.py 不加载 PyQt 桌面窗口）
start_mode = web
fay_url = http://127.0.0.1:5000
