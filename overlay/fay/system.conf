# Fay 容器运行配置（overlay：挂载到 /app/system.conf，只读）
#
# 为什么必须有这个文件：fay 仓库里根本没有 system.conf —— 上游从 v4.8.1 起就没提交过
# 它（只有 system.conf.bak 模板和 packaging/defaults 里那份），fork 的 ce900d8 还进一步
# 把它写进 .gitignore（:134 行）。而默认启动流程依赖的远程配置中心
# http://1.12.69.110:5500 现已不可达。没有本地 system.conf，Fay 无法启动。
#
# 这份示例把三类 AI 能力都指向宿主机 Ollama（host.docker.internal:11434），不使用任何云端
# API key。这是"克隆下来就能起"的默认，**不是任何一台具体机器的现状**：对话的端点、密钥、
# 模型名都可以被环境变量逐条覆盖（机制在 patches/fay/0009 与 0006，透传在 compose 的
# x-llm-endpoint），本机现在对话就打给栈外另一个 OpenAI 兼容服务，只有嵌入还落在这台
# ollama 上。要改这些，改 `containerd/.env` 而不是这份文件 —— 它被 git 跟踪。
# 换模型不必动本文件（设 .env 里那两条 *_MODEL_ENGINE 就行）；真改了本文件，因为是只读
# bind mount，`docker compose restart fay` 就够了，不用重建镜像。

[key]
# ---------- ASR：容器无声卡，麦克风链路整体关闭（config.json 里 record.enabled=false）
# 保留 funasr 选项但不填密钥；ali 模式会要求阿里云密钥，故不选。
ASR_mode = funasr
local_asr_ip = host.docker.internal
local_asr_port = 10197
ali_nls_key_id =
ali_nls_key_secret =
ali_nls_app_key =

# ---------- TTS：取任意非 ali/gptsovits/gptsovits_v3/volcano 的值 → core/fay_core.py:103
# 落到 tts/ms_tts_sdk.py；其中 ms_tts_key 为空时走 edge_tts 免费通道。
tts_module = edge
ms_tts_key =
ms_tts_region =
ali_tss_key_id =
ali_tss_key_secret =
ali_tss_app_key =
volcano_tts_appid =
volcano_tts_access_token =
volcano_tts_cluster = volcano_tts
volcano_tts_voice_type =

# ---------- 小模型（日常对话 / 工具编排）：示例指向 Ollama 的 OpenAI 兼容端点 /v1 ----------
# 这三条分别可被 FAY_GPT_BASE_URL / FAY_GPT_API_KEY / FAY_GPT_MODEL_ENGINE 覆盖。
gpt_api_key = ollama
gpt_base_url = http://host.docker.internal:11434/v1
gpt_model_engine = qwen3.5:9b

# ---------- 大模型（复杂推理；未配置则自动降级为小模型）----------
# 示例让小模型和大模型用同一个 qwen3.5:9b（权重 6.6GB）：一份 16GB 显存的机器装得下它，
# 也就不必为分档再配一套端点。显存真被别的服务占走时它会掉到 CPU 上推，一句话是分钟级
# —— 本栈那几条超时预算（compose 的 x-llm-timeouts）就是被这种状态顶大的，数字与复盘见
# containerd/AGENTS.md「真实瓶颈是显存」那一节。
# 想真正启用大模型分档就改成 qwen3.8:27b（17.7GB 权重，会溢出到内存/CPU，
# 首个请求可能加载数分钟并触发超时），或直接把这三行留空走单模型降级。
big_model_engine = qwen3.5:9b
big_model_base_url = http://host.docker.internal:11434/v1
big_model_api_key = ollama

# ---------- Embedding：仿生记忆与知识库检索共用的向量端点 ----------
# 示例走 Ollama 的 OpenAI 兼容 /v1/embeddings。这一组与上面的对话是**两条独立的覆盖**：
# 本机现在对话搬给了栈外服务，嵌入仍留在这台 ollama。写进仿生记忆的向量与知识库检索用的
# 向量必须出自同一个模型、同一个端点，分叉的症状是"检索永远命中不到刚灌进去的内容"且
# 不报错 —— 所以 compose 用同一组 YUESHEN_EMBED_* 键喂两侧，不留两套名字。
embedding_api_model = qwen3-embedding:0.6b
embedding_base_url = http://host.docker.internal:11434/v1

# 示例端点都在宿主上，不需要代理
proxy_config =

# ---------- 启动模式 ----------
# web = 服务器/容器模式（utils/config_util.py 不加载 PyQt 桌面窗口）
start_mode = web
fay_url = http://127.0.0.1:5000
