name: digitalhuman

# ---------------------------------------------------------------------------
# DigitalHuman 容器集成：Fay + 康养后端 + MySQL + Redis + 对话协议适配器。
#
# 设计约束（对应上游分析里的四条断裂接缝）：
#   * 不改 fay / service / ue 任何一行代码。环境差异全部由 overlay 挂载解决：
#       containerd/overlay/fay/system.conf -> /app/system.conf   (仓库里不存在，必须提供)
#       containerd/overlay/fay/config.json -> /app/config.json   (关本地播放与直播间)
#     这三份 json（config / mcp_servers / mcp_prestart_tools）在仓库里存的是 **.example
#     模板**：它们都是下面那种**可写**挂载的源文件，Fay 运行期会整份重写回来（connection_time、
#     ensure_ascii 把中文转成 \uXXXX、末尾换行被吃掉），所以实值不进 git，本地那份由 run.sh
#     首跑复制（tools/gen_overlay.py）。挂载路径本身没变，但新克隆得先跑过一次 run.sh。
#   * 后端与 Fay 的契约不同形（后端 POST /api/chat，Fay 只有异步 /api/send + /api/get-msg
#     轮询），由 adapter 服务在中间转换，两边源码保持原样。
#   * AI 能力全在栈外，而且是**两台**服务：对话模型由一个 OpenAI 兼容的本地推理服务提供
#     （本机 :11432），向量嵌入由宿主 Ollama 提供（:11434）。两者都从 extra_hosts 的
#     host-gateway 进，端点与模型名各自独立可换 —— 见 x-llm-endpoint 与
#     containerd/README.md「AI 端点落在哪里：对话与嵌入是两台服务」。
#   * UE5 不进 compose —— 实测该仓库 10.06GB / 17383 文件，EngineAssociation 5.1 但
#     不含引擎本体，11 个启用插件里 5 个要 Epic  Marketplace 授权，11 个模块带 Source/
#     却全树零个预编译二进制，且端点级引用 10002 协议为 0 处。数字见 containerd/README.md
#     「UE 仓库的容器侧处置」，由 ./run.sh test 里的 ue-audit 容器现场产出。
# ---------------------------------------------------------------------------

# 两条到宿主机/局域网的名字映射，全栈统一：
#   host.docker.internal —— 宿主机的 AI 服务从这里进（嵌入 = Ollama :11434；对话端点
#                            写在 .env，可以是这台机器的另一个地址或另一台机器）。
#   dh-host / ue-host    —— 本栈那台机器的局域网地址、与跑 UE5.1 编辑器的那台 Windows。
#                            UE 实际在另一台电脑上（实测：它只往 :10002 拨进来，Fay 从不外拨），
#                            所以这两个名字目前只是给「将来要外拨 UE」的地方留的稳定入口，
#                            不是任何判据的前提。留 127.0.0.1 为默认值：不配就退回本机，
#                            不会因为解析不到名字而把整个服务拖崩。
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "dh-host:${DH_LAN_IP:-127.0.0.1}"
    - "ue-host:${UE_LAN_IP:-127.0.0.1}"

x-restart: &restart
  restart: unless-stopped

# LLM / embedding 请求的超时与重试。这两个数字上游是写死的
# （llm/execution_manager.py 小模型 60s/1 次重试、utils/api_embedding_service.py
# 60s/2 次重试），containerd/patches/ 把它们开成环境变量后才可调。
#
# 为什么要调：那张 16GB 卡从来不是全给本栈的 —— 量过的那几轮里，栈外的对话推理服务
# 自己就占 10.5GB 以上（2026-09-23 实测 10742 MiB / 16376 MiB），剩下的显存要在
# 对话模型与 qwen3-embedding:0.6b 之间反复换入换出，实测一次 embedding
# 请求就要 >60s → 必然超时 → 整条请求重发 3 遍 = 180s，把问答链路的预算吃光
# （一句话回答反而等不到）。所以：LLM 给足时间且不再重试，embedding 快速失败，
# 让它落到 gpt_structure.py:294 上游自带的「本地模拟向量」兜底路子上。
# 显存腾开以后把 EMBEDDING_TIMEOUT 调大（如 180）就恢复真向量记忆。
#
# STREAM_REPLY_IDLE_TIMEOUT 是第三处写死的时限：gui/flask_server.py:51 读回复流的
# 空闲上限 180s。它必须 >= 上面的 LLM_REQUEST_TIMEOUT，否则「模型正在慢慢想」会被
# 判成「Fay 卡住」：run #2 实测 fork 的规划器链路单次 180~240s，于是
# /v1/chat/completions 每次都正好在 180.0s 返回空 content，而同机同模型的
# 上游直出实例 172.1s 拿到了「好」（当时为对照起的 origin-fay，该实例已撤）。
x-llm-timeouts: &llm-timeouts
  LLM_REQUEST_TIMEOUT: "420"
  LLM_REQUEST_MAX_RETRIES: "0"
  # 这两个值原本抄的是上游默认（60s / 2 次）再往下压成 20s / 0 次，理由是「容器里
  # 不要死等」。run #7 把这条决定否证了：整机 ollama 换入模型实测要 72.9s，20s/0 次
  # 必然超时 → 记忆检索静默退化成模拟向量（日志：调用 API embedding 失败，使用模拟
  # 向量代替），而自检线程被这串重试拖住，:8765 到第 61 秒才 bind。
  # 现在按实测最坏值给：90s 单次 + 1 次重试，换入完成后一次 embedding 实测 0.06s。
  EMBEDDING_TIMEOUT: "90"
  EMBEDDING_MAX_RETRIES: "1"
  STREAM_REPLY_IDLE_TIMEOUT: "480"

# LLM / embedding 的端点与密钥。全部默认空 = 逐字用 overlay/fay/system.conf 里那份示例
# 值（宿主 ollama）。之所以走环境变量而不是改那份文件：端点是按机器变的事（对话模型由
# 哪个服务回答、它在哪台机器哪个口上），而被跟踪的配置文件只能留「在这台机器上跑得
# 起来」的示例 —— 上一轮把那台 26B 的端点写进 system.conf，那 6 行机器拓扑就进了 git 历史。
# 本机现在的样子：对话 = :11432 那台 26B（栈外的本地服务），嵌入 = :11434 的 ollama。
# 机制在 patches/fay/0009，模型名那两条在 0006。
x-llm-endpoint: &llm-endpoint
  FAY_GPT_BASE_URL: ${FAY_GPT_BASE_URL:-}
  FAY_GPT_API_KEY: ${FAY_GPT_API_KEY:-}
  FAY_BIG_MODEL_BASE_URL: ${FAY_BIG_MODEL_BASE_URL:-}
  FAY_BIG_MODEL_API_KEY: ${FAY_BIG_MODEL_API_KEY:-}
  # 这三条刻意由 yueshen-rag 那侧的 YUESHEN_EMBED_* 同一组键喂，而不是再开一套名字：
  # Fay 写进仿生记忆的向量与知识库检索用的向量必须出自同一个模型、同一个端点，分叉的
  # 症状是「检索永远命中不到刚灌进去的内容」，且不报错（本机踩过一次，见 EMBEDDING_TIMEOUT
  # 上面 run #7 那段）。留空时两边各自回落默认，实测仍指向同一个宿主 ollama。
  # patches/fay/0006 放开的其实是四个键：base_url / api_key / **model_engine** 各两条。
  # 下面四个端点键来自 0009，模型名这两条却是后补的 —— 漏的时候 `.env` 里写
  # FAY_GPT_MODEL_ENGINE 一点作用也没有（`docker exec dh-fay env` 里根本没有这个键），
  # 改的人以为换了模型，实际发的还是 system.conf 里那个名字。留空 = 逐字回落 system.conf
  # （补丁的写法是 `os.environ.get(...) or 原值`，空串走 or 分支），所以这两条默认空是安全的。
  FAY_GPT_MODEL_ENGINE: ${FAY_GPT_MODEL_ENGINE:-}
  FAY_BIG_MODEL_ENGINE: ${FAY_BIG_MODEL_ENGINE:-}
  FAY_EMBEDDING_MODEL: ${YUESHEN_EMBED_MODEL:-}
  FAY_EMBEDDING_BASE_URL: ${YUESHEN_EMBED_BASE_URL:-}
  FAY_EMBEDDING_API_KEY: ${YUESHEN_EMBED_API_KEY:-}

# lite 那份**刻意不跟主实例共用** &llm-endpoint。它存在的理由是「本机显存装得下的那个小模型
# + 宿主 ollama」，模型名由 FAY_LITE_MODEL_ENGINE 钉在本地；端点要是跟着主实例搬走，
# 就等于拿 qwen2.5:1.5b 去问一台只有大模型的服务 —— 探针会红在模型名上，而红的原因和它
# 要证的「问答链路真的通」毫无关系（2026-09-22 实测：主实例那个端点的 /v1/models 只有
# gemma-4-26b-a4b-nvfp4 一条）。真要让它也跟着搬，显式给 FAY_LITE_GPT_BASE_URL。
x-llm-endpoint-lite: &llm-endpoint-lite
  FAY_GPT_BASE_URL: ${FAY_LITE_GPT_BASE_URL:-http://host.docker.internal:11434/v1}
  FAY_GPT_API_KEY: ${FAY_LITE_GPT_API_KEY:-ollama}
  FAY_BIG_MODEL_BASE_URL: ${FAY_LITE_GPT_BASE_URL:-http://host.docker.internal:11434/v1}
  FAY_BIG_MODEL_API_KEY: ${FAY_LITE_GPT_API_KEY:-ollama}
  # embedding 那三条仍然与主实例同一组键：两个实例往同一张会话表旁边写的仿生记忆坐标
  # 必须出自同一个模型、同一个端点，这一条不能"lite 化"。
  FAY_EMBEDDING_MODEL: ${YUESHEN_EMBED_MODEL:-}
  FAY_EMBEDDING_BASE_URL: ${YUESHEN_EMBED_BASE_URL:-}
  FAY_EMBEDDING_API_KEY: ${YUESHEN_EMBED_API_KEY:-}

# Fay 两实例（fay / fay-lite）共用同一份镜像、同一套对外端口，
# 也就共用同一条就绪判据。只看 :5000 会过早放行：实测开机 :5000/:5010/:10002/
# :10003 第 6 秒全 bind，而 :8765（MCP SSE）要等到第 24~61 秒 —— 它排在开机自检
# 那串 embedding 重试之后。compose --wait 提前判 healthy，探针就会打进一个只起了
# 一半的实例（run #7 里 MCP SSE / OpenAI 兼容层 / /api/send 三条 FAIL 全这么来的）。
#
# 探测方式按"只问内核、不拨号"来写：健康检查是**周期性**的（容器活着就一直跑），
# 早先用 socket.create_connection 逐个拨号，每 10s 一轮就往 :10002/:10003 那两个
# websockets 服务各塞进一条半开的空连接，对端按 HTTP 解析必然 400，于是
# `websockets/legacy/server.py:230` 每轮印两对 `connection failed (400 Bad Request)`
# + `connection closed` —— 一台空闲容器每小时 720 对，全是本栈自己造的。
# 换成读 /proc/net/tcp{,6} 的 LISTEN 表：判据仍然是那五个端口 bind 没有（run #7
# 要的就是这个），但一个字节都不发到业务端口，容器日志恢复成只有被测对象在说话。
# 真握手那部分不在这里，探针各自都会打（MCP SSE 走 event: endpoint、:10002 走完整会话）。
x-fay-healthcheck: &fay-healthcheck
  test: ["CMD", "python", "-c", "import pathlib,sys; want={5000,5010,8765,10002,10003}; have={int(r.split()[1].rsplit(':',1)[1],16) for f in ('/proc/net/tcp','/proc/net/tcp6') for r in pathlib.Path(f).read_text().splitlines()[1:] if r.split()[3]=='0A'}; sys.exit(1 if want-have else 0)"]
  interval: 10s
  timeout: 8s
  retries: 30
  start_period: 90s

# Fay 的 MCP 服务器清单（faymcp/mcp_service.py:29 就是这个路径）。三份 overlay 与
# 仓库里的只差 id=4 一项：transport stdio → sse、ip 填本栈的容器地址。为什么必须换
# 掉而不是留着 —— 上游那份是 stdio，容器里没人在 stdin 那头写，这条服务永远连不上；
# 详见 patches/yueshen_rag/0001。两份而不是共用一份，因为 mcp_service.py:132 在每次
# 连接/断开后整份重写这个文件（更新 connection_time），两个容器写同一个宿主文件会互相盖。
# 所以这条挂载刻意不带 :ro。两个实例各挂自己那份，见 overlay/{fay,fay-lite}/。
# 「会整份重写」这一条也是这三份 json 在仓库里只以 .example 存在的直接原因 —— 同一条挂载
# 上，人手写的基线进 git、机器回写的实值留本地，两件事不再混在一个文件里。

services:
  mysql:
    <<: *restart
    image: mysql:8.0
    container_name: dh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 跟 BIND_ADDR 走，**不再有"恒 loopback"这条例外**（2026-09-22 改的口径：dev 档位
      # 直接绑 0.0.0.0，管理口与应用口一起出去）。收紧靠档位而不是这一行：prod 的
      # BIND_ADDR 由 run.sh 钉死在 127.0.0.1（改成别的地址直接拒），所以这里的
      # `${BIND_ADDR:-127.0.0.1}` 在 prod 下逐字等于原来的写死值。
      # 代价写在这里，不粉饰：`./run.sh dev` 之后同网段的任何机器都敲得到 13306，
      # 能不能进去只看 MYSQL_ROOT_PASSWORD 这一道口令 —— dev 用完 ./run.sh down。
      - "${BIND_ADDR:-127.0.0.1}:${MYSQL_HOST_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 45s

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: dh-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      # 同 mysql：不再恒 loopback，跟 BIND_ADDR 走，收紧交给档位。Redis 这边连"库"的
      # 概念都没有，一个 requirepass 就是全部 —— dev 期间它是一个对同网段开放的可写 KV。
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------------------------------------------------------- yueshen 知识库（chromadb）
  # fay/mcp_servers/yueshen_rag 是仓库里唯一带重依赖（chromadb）的 MCP 服务器，也是
  # 此前探针那条「按边界 SKIP」的成因。这里把它单独容器化：不把 chromadb 装进 Fay 镜像
  # （那份镜像里 uvicorn<0.35 + websockets~=10.4 的组合正是 :8765 MCP SSE 判据能绿的
  # 前提，chromadb 会把它俩都拽起来），而是让 Fay 通过 MCP 的 SSE transport 连过来。
  # 上游只有 stdio 一条路，所以这条路是 patches/yueshen_rag/0001 开出来的环境变量开关。
  #
  # 端口不发布到宿主 —— Fay 在 compose 网络里按容器名打 http://yueshen-rag:8766/sse。
  yueshen-rag:
    <<: [*host-gateway, *restart]
    build:
      context: ..
      dockerfile: containerd/images/yueshen_rag.Dockerfile
    image: dh-yueshen-rag:local
    container_name: dh-yueshen-rag
    environment:
      TZ: Asia/Shanghai
      # 嵌入模型走宿主 Ollama 的 OpenAI 兼容口，与 system.conf 里 embedding_* 同一套。
      # 模型名必须显式给：server.py 的默认值是 "embedding"，那是 Fay 自己 :5000 转发口
      # 上的别名，直连 ollama 时它认不出这个名字。
      # 这三个键同时也是上面 &llm-endpoint 里 FAY_EMBEDDING_* 的来源 —— 一组键喂两侧，
      # 就是为了「写进库的向量」和「查询用的向量」不可能出自不同的模型或端点。
      YUESHEN_EMBED_BASE_URL: ${YUESHEN_EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
      YUESHEN_EMBED_API_KEY: ${YUESHEN_EMBED_API_KEY:-sk-fay}
      YUESHEN_EMBED_MODEL: ${YUESHEN_EMBED_MODEL:-qwen3-embedding:0.6b}
      # 上游写死 30s（patches/0002 才可调）。本机换入 embedding 模型实测要 70s 以上，
      # 30s 撞上的表现是 ingest 返回 inserted:0 而不是报错，所以给到 3 倍余量。
      YUESHEN_EMBED_TIMEOUT: ${YUESHEN_EMBED_TIMEOUT:-180}
    volumes:
      - yueshen-persist:/app/persist
      # 项目方给的科普语料（14 份 .docx 切片后的 14 个文件）。镜像里那份
      # containerd/tools/make_yueshen_corpus.py 生成的只有 3 段，够验链路、不够当知识。
      # 挂成 /app/corpus 的子目录：`ingest_yueshen` 是整目录扫的（server.py:192 用
      # os.walk），所以这份和合成语料一起入库、一起被探针那组的 reset 重建，不会各活各的。
      # 切片产物本身不进 git（数据属于伙伴方、两个仓库都是 PUBLIC），新克隆先
      # ./run.sh kbslice 把它建出来，否则这里挂到的是空目录、`./run.sh kb` 会报 chunks=1。
      # 重新切片：./run.sh kbslice <zip|目录>，见 tools/slice_kb_corpus.py 的 docstring。
      - ./seed/kb_corpus:/app/corpus/kb:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8766),3).close()"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------------ Fay 认知中台
  fay:
    <<: [*host-gateway, *restart]
    build:
      context: ..
      dockerfile: containerd/images/fay.Dockerfile
    image: dh-fay:local
    container_name: dh-fay
    # 刻意不传 -config_center：那会强制走远程配置中心（现已不可达），
    # 去掉后 config_util 才回落到下面两个 overlay 文件。
    command: ["python", "main.py", "start"]
    environment:
      TZ: Asia/Shanghai
      # Fay 回给数字人的音频文件地址（UE 拿它去 :5000 取 wav）。不设 = 上游原行为
      # （读 system.conf，为空则自动探测本机 IP）。UE 在另一台电脑上时必须设成那台机器
      # 够得着的地址，见 patches/fay/0007 与 README「跨机流量」。
      FAY_URL: ${FAY_URL:-}
      # 同一个 mapping 里不能写两个 `<<:`（YAML 1.1 的 merge 键重复即报错），所以并成列表。
      <<: [*llm-timeouts, *llm-endpoint]
    volumes:
      - ./overlay/fay/system.conf:/app/system.conf:ro
      # 下面这三条的宿主侧源文件不在仓库里 —— 仓库里是同名的 .example 模板，本地这份
      # 由 run.sh 首跑复制（它们都是可写挂载，Fay 会回写）。
      - ./overlay/fay/config.json:/app/config.json
      - ./overlay/fay/mcp_servers.json:/app/faymcp/data/mcp_servers.json
      # prestart 注册表：让知识库在 LLM 推理之前就先跑一次 query_yueshen，
      # 结果作为 <prestart> 上下文注入。和 mcp_servers.json 一样是**可写**挂载 ——
      # faymcp/prestart_registry.py:61-69 在控制台改设置时会回写这个文件。
      # 没有这一条，「知识库命中」只能靠模型自己决定调不调工具（它不调，就是 0 步）。
      - ./overlay/fay/mcp_prestart_tools.json:/app/faymcp/data/mcp_prestart_tools.json
      - fay-memory:/app/memory
      - fay-cache:/app/cache_data
      - fay-logs:/app/logs
      - fay-samples:/app/samples
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FAY_HTTP_PORT:-5000}:5000"      # Flask：Web UI + OpenAI 兼容口
      - "${BIND_ADDR:-127.0.0.1}:${FAY_HUMAN_WS_PORT:-10002}:10002" # 数字人 WS（未来给 UE/前端）
      - "${BIND_ADDR:-127.0.0.1}:${FAY_WEB_WS_PORT:-10003}:10003"   # 浏览器面板 WS
    healthcheck: *fay-healthcheck
    depends_on:
      redis:
        condition: service_started
      yueshen-rag:
        condition: service_started

  # ------------------------------------------------ 后端 ↔ Fay 的 /api/chat 协议适配
  adapter:
    <<: [*host-gateway, *restart]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-adapter
    command: ["python", "/adapter/server.py"]
    environment:
      TZ: Asia/Shanghai
      FAY_BASE_URL: http://fay:5000
      ADAPTER_PORT: "8010"
      ADAPTER_MAX_WAIT_SECONDS: ${ADAPTER_MAX_WAIT_SECONDS:-500}   # 必须 > Fay 的 STREAM_REPLY_IDLE_TIMEOUT(480)、< 后端 FAY_FORWARD_TIMEOUT_SECONDS
      # 静默判停只是**没看到 patches/fay/0008 那个哨兵时**的退路（镜像没按新补丁重建才会走到），
      # 而且要求此刻手里已经有正文 —— 只剩占位句时再等也不亏，交出去的一定是错的。
      # 不能再当"响应速度"调：两阶段协议里「占位句 → 工具执行 → 正式回答」这段静默实测 3~30s，
      # 上游那个 2s 会在这里把回答截成半句（见 adapter/server.py 模块头）。
      ADAPTER_SETTLE_SECONDS: ${ADAPTER_SETTLE_SECONDS:-8}
      ADAPTER_USERNAME_PREFIX: ${ADAPTER_USERNAME_PREFIX:-elder_}
    volumes:
      - ./adapter:/adapter:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADAPTER_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8010/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      fay:
        condition: service_started

  # ------------------------------------------------------------------- 康养后端服务
  backend:
    <<: [*host-gateway, *restart]
    build:
      context: ..
      dockerfile: containerd/images/service.Dockerfile
      # 不指定 target 会构到最后一个阶段（test），生产镜像就带上 pytest 了。
      target: runtime
    image: dh-service:local
    container_name: dh-backend
    environment:
      TZ: Asia/Shanghai
      APP_NAME: ${APP_NAME:-康养数字人后端}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: /api/v1
      # --- 数据库（容器内直连，绕开宿主 3306 上已有的 mysql 容器）---
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-care_echo_rehab}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # --- 鉴权 ---
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      # --- Fay：后端只认 /api/chat，交给 adapter 翻译 ---
      FAY_HTTP_URL: http://adapter:8010
      FAY_CHAT_PATH: /api/chat
      # 超时链自下而上必须单调变长，否则下层还在等、上层先放弃，
      # 用户看到的就是「后端说超时」而不是 Fay 真正给出的回复：
      #   LLM 420 < Fay 回复空闲上限 480 ≤ adapter 500 < backend 520
      # 依据是实测：本机 9b 只有 6% 权重驻留显存，无规划器的对照实例一句话都要 172~301s，
      # 上游默认值（adapter 60 / backend 30，见 service/app/core/config.py:43）
      # 在这台机器上必然抢跑。显存腾开后按注释把这几个数字调小即可。
      FAY_FORWARD_TIMEOUT_SECONDS: ${FAY_FORWARD_TIMEOUT_SECONDS:-520}
      FAY_WS_URL: ws://fay:10002
      # 上游 config.py 的 json_data_dir 默认值是开发者本机 Windows 路径，
      # 参考语料（动作库/计划模板/异常规则/随访标准/分级规则）不在仓库里。
      # 容器用一份只读的最小样例语料顶上，保证导入链路和自测可跑。
      JSON_DATA_DIR: ${JSON_DATA_DIR:-/app/reference_data}
    volumes:
      - backend-data:/app/data
      - ./seed/service_reference_data:/app/reference_data:ro
    # 迁移 -> 导入参考语料 -> 危机热线种子 -> 起服务。
    # 播种用 ';' 与 exec 串联：语料缺失时只记日志，不阻塞服务启动。
    command:
      - sh
      - -c
      - >
        python -m alembic upgrade head &&
        python -m scripts.import_reference_json --category all &&
        python -m scripts.seed_crisis_hotlines;
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      adapter:
        condition: service_started

  # ------------------------------------------------------------- CareEcho H5 前端
  # 伙伴方的仓库（gitee xie-zha-zha/carecho_final，submodule 在 ../frontend），只读构建：
  # 镜像里是他们 `npm run build` 的原样产物 + 我们这个同源外壳（containerd/frontend/
  # carecho_web.py）。外壳做三件事：发静态文件、把它唯一真会调的 `POST /api/chat/send`
  # 翻译成后端那三步（dev-login → 建会话 → 发消息）、以及把麦克风那条
  # `ws:///funasr-ws` 同源转发进 funasr（Vite 的 dev proxy 在生产产物里不存在）。
  # 前端不登录、不带 token，身份只能由这一侧按 cookie 发；细节见那份文件的 docstring。
  #
  # 端口默认 5173 是故意的：那是他们 README 与 xmov.js 里唯一写死的开发地址，宿主端口
  # 对齐之后「http://127.0.0.1:5173 打开」这句话对容器同样成立。
  frontend:
    <<: *restart
    build:
      context: ..
      dockerfile: containerd/images/frontend.Dockerfile
    image: dh-frontend:local
    container_name: dh-frontend
    environment:
      TZ: Asia/Shanghai
      CARECHO_BACKEND: http://backend:8000
      # 这一侧的等待上限。浏览器那端 axios 的 30s 是前端写死的常量（src/api/request.js:6），
      # 我们改不了也不该改：本机 9b 冷启动一句话 172~301s，前端会先于后端放弃 —— 那是它的
      # 已知边界（README「前端」一节），不是这里偷偷调小的理由。
      CARECHO_UPSTREAM_TIMEOUT: ${CARECHO_UPSTREAM_TIMEOUT:-90}
      # 同源 WebSocket 转发的常量表：`路径=上游` 逗号分隔，精确匹配、上游取自这张表、
      # query 一律丢掉 —— 客户端给的 path 永远不进 getaddrinfo，所以这不是开放代理。
      # 麦克风那条（/funasr-ws → funasr:10095）必须在这里，因为我们发的是 `npm run build`
      # 的产物，伙伴方 vite.config.js 里那条 dev proxy 在生产构建里根本不存在。
      # /fay-ws 故意留在表外：前端那份 fay.js 里的 FayClient 是一个没人调用的死导入。
      CARECHO_WS_RELAY: ${CARECHO_WS_RELAY:-/funasr-ws=funasr:10095/}
      CARECHO_WS_RELAY_IDLE: ${CARECHO_WS_RELAY_IDLE:-180}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      # service_started 而不是 service_healthy：funasr 首次启动要下 1.3GB 模型，
      # 挂在这个条件上会把整个前端连带等十几分钟。转发是逐连接拨号的，上游没起来
      # 只会让「按下麦克风」那一刻失败，不该让页面本身打不开。
      funasr:
        condition: service_started

  # ------------------------------------------------------------ FunASR 语音识别
  # H5 麦克风那一跳的真后端：浏览器 ScriptProcessor 把无头 PCM（int16/16k/单声道）
  # 一帧帧推到页面同源的 ws://<host>/funasr-ws，外壳按上面那张常量表转发进来，
  # 回去的是 {"text","is_final"}。协议逐字段照前端来，伙伴方代码一个字不改。
  #
  # 本栈的 AI 依赖里，语音识别这处既不由宿主 Ollama、也不由那个对话端点服务（另一处是
  # 浏览器里的魔珐 Xmov 云 TTS，在我们代码之外）：ollama 的 /api/chat 只收 text + images，
  # 没有音频输入口，模型清单里也没有 paraformer。
  # 值得记下来的是它与 Fay 自己那条 ASR 链不是一回事：overlay/fay/system.conf 里
  # local_asr_ip/local_asr_port 指的是 host.docker.internal:10197，那套方言是
  # 「裸文本回复 + {"vad_need":…}」，与前端要的 {"text","is_final"} 不兼容
  # —— 所以本服务只服务 H5，Fay 侧保持原样（见 README「未覆盖能力」）。
  #
  # 基础文件里**不发布任何宿主端口**：生产这条链只经 5173 同源转发进出，多开一个 10095
  # 只是多一个无鉴权入口。dev 档位才直发（见 docker-compose.dev.yml）。
  funasr:
    <<: [*host-gateway, *restart]
    build:
      context: ..
      dockerfile: containerd/images/funasr.Dockerfile
    image: dh-funasr:local
    container_name: dh-funasr
    environment:
      TZ: Asia/Shanghai
      # 三个模型名与版本一起钉死（paraformer-large 990MB + fsmn-vad + ct-punc 292MB ≈ 1.3GB）。
      # 不钉 revision 的话，modelscope 每次启动都做一次「有没有新版」的网络探测，
      # 而那次探测被一个裸 except 包着 —— 断网时表现不是报错，是慢。
      FUNASR_MODEL: ${FUNASR_MODEL:-paraformer-zh}
      FUNASR_VAD_MODEL: ${FUNASR_VAD_MODEL:-fsmn-vad}
      FUNASR_PUNC_MODEL: ${FUNASR_PUNC_MODEL:-ct-punc-c}
      FUNASR_REVISION: ${FUNASR_REVISION:-v2.0.4}
      # 单会话上限与并发推理数：这两个是内存与「按着麦克风不放」的边界，值本身在
      # asr/server.py 里读，这里透出来是为了不改镜像就能调。
      FUNASR_MAX_SECONDS: ${FUNASR_MAX_SECONDS:-60}
      FUNASR_MAX_INFLIGHT: ${FUNASR_MAX_INFLIGHT:-2}
      # torch 不设这个就会吃满 16 核，而本机 CPU 还要留给那些没全进显存的模型权重。
      FUNASR_TORCH_THREADS: ${FUNASR_TORCH_THREADS:-4}
    volumes:
      # 挂在 MODELSCOPE_CACHE 上（镜像里 = /models）。这一卷决定「首次要不要下 1.3GB」：
      # ./run.sh asr-seed 可以从本机伙伴方已有的那个缓存卷拷过来，新克隆则正常下载。
      - funasr-cache:/models
    healthcheck:
      # 判据是 server.py 在 **bind 之后**写的那个文件：既不是"进程起了"（模型还在下，
      # 端口没人听），也不是"端口通了"（模型还没加载完，第一问必然超时）。
      # asr-test / asr-probe 都拿这条当"可以打了"的凭据，所以顺序写反过一次就修在源头。
      test: ["CMD", "python", "-c", "import os,sys;sys.exit(0 if os.path.exists('/tmp/asr.ready') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  # ------------------------------------------------------- 测试件（compose --profile test）
  # 跑 service 仓库自带的 pytest（12 个文件）。测试代码以 :ro 挂进容器，
  # 不 COPY 进镜像（.dockerignore 排除），也不写回仓库。
  # 用的是独立库 care_echo_rehab_test（见 sql/init/01-create-test-database.sql），
  # 免得测试往业务数据里塞脏行。
  backend-test:
    <<: [*host-gateway]
    profiles: ["test"]
    build:
      context: ..
      dockerfile: containerd/images/service.Dockerfile
      target: test
    image: dh-backend-test:local
    container_name: dh-backend-test
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      DEBUG: "true"
      REMINDER_SCHEDULER_ENABLED: "false"
      API_V1_PREFIX: /api/v1
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_TEST_DB:-care_echo_rehab_test}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FAY_HTTP_URL: http://adapter:8010
      FAY_CHAT_PATH: /api/chat
      JSON_DATA_DIR: ${JSON_DATA_DIR:-/app/reference_data}
    volumes:
      # 不再把宿主 ../service/tests 挂进来：镜像里的 tests 已经过
      # containerd/patches/service/*.patch 修补，挂载会盖掉补丁。
      - ./seed/service_reference_data:/app/reference_data:ro
      # 测试库重置脚本（containerd 自己的工具，不进镜像，改了立刻生效）。
      - ./tools:/tools:ro
    # 顺序有讲究：重置测试库 → 迁移 → 灌参考语料，这三步任何一步失败都不该跑 pytest
    # （跑在状态未知的库上，绿了也没意义），所以用 && 串起来；只有 seed_crisis_hotlines
    # 允许失败后继续（它幂等、且热线数据缺失只影响那一条用例），因此放在 {} 里当弱步骤，
    # 整组的退出码由 pytest 决定。
    command:
      - sh
      - -c
      - >
        python /tools/reset_test_db.py &&
        python -m alembic upgrade head &&
        python -m scripts.import_reference_json --category all &&
        { python -m scripts.seed_crisis_hotlines;
        python -m pytest -q --color=no -rA; }
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 后端活体探针：量的必须是「这个正在应答 HTTP 的进程」。backend-test 那组用
  # TestClient 在 pytest 自己进程内起 app、连的又是 care_echo_rehab_test，于是
  # 「业务库有没有跟到 head」「路由少挂了一个 module」「这个镜像起的服务会不会 500」
  # 它全看不见。这里复用 backend 那份镜像（同一批补丁），只把 probes/ 只读挂进去。
  # MYSQL_DB 指业务库而不是测试库：这条判据要的就是业务库的真实状态；详情里会印出
  # 库名和表数，改了一边忘了另一边时肉眼也对得上。
  backend-probe:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-service:local
    container_name: dh-backend-probe
    restart: "no"
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: /api/v1
      BACKEND_URL: http://backend:8000
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-care_echo_rehab}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JSON_DATA_DIR: ${JSON_DATA_DIR:-/app/reference_data}
    volumes:
      - ./probes:/probe:ro
      - ./seed/service_reference_data:/app/reference_data:ro
    command: ["python", "/probe/backend_probe.py"]
    depends_on:
      backend:
        condition: service_healthy

  # Fay 对外契约探针：HTTP 问答 + 10003/10002 WebSocket + edge_tts 合成。
  # 探针跑在 dh-fay 同款镜像里（websockets 版本、依赖、/app 源码都在），
  # 脚本本身只读挂载，不属于任何上游仓库。
  fay-probe:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-fay-probe
    restart: "no"
    working_dir: /app
    environment:
      # 探针进程自己也要 import 被测容器那份 api_embedding_service（判仿生记忆的向量
      # 真伪），不给这三个变量它就退回上游默认 60s×3 次 —— 实测那条判据因此花了
      # 183.2s 才落回伪向量，既白烧三倍墙钟，量的又不是容器真正在用的预算。
      # 端点那组键同理必须挂上：探针量的「直连 LLM 下限耗时」得是被测实例真在用的那个
      # 端点与那个模型名。只挂 timeouts 时它读的是 system.conf 里那两份示例值（宿主
      # ollama + qwen3.5:9b），而 .env 早把对话搬走了 —— 于是这条证据量的不是这台机器的事。
      <<: [*llm-timeouts, *llm-endpoint]
    volumes:
      - ./probes:/probe:ro
      # 探针里 check_tts 会 import utils.config_util 走真实 TTS 分支，
      # 而 load_config() 在找不到本地 system.conf 时会去连已下线的远程配置中心
      # （1.12.69.110:5500，光超时就要 150s）。把被实测容器同一份 overlay 挂进来。
      - ./overlay/fay/system.conf:/app/system.conf:ro
      - ./overlay/fay/config.json:/app/config.json:ro
    command: ["python", "/probe/fay_probe.py", "--base", "http://fay:5000", "--timeout", "90"]
    depends_on:
      fay:
        condition: service_healthy
  # ------------------------------------------------ 轻模型实例：把问答链路真正跑通一次
  # fay 用的是 system.conf 里配好的 qwen3.5:9b，这是用户的真实配置，
  # 不该为了跑测试去改。但量那几轮时这张 16GB 卡只剩 0.8GB 能给 9b（占走的主体是栈外那台
  # 对话推理服务），ollama /api/ps 实测 size_vram=387029401 / size=6149206178 —— 6% 进显存，
  # 于是规划器一次要 165~240s，问答质量根本没法在测试里判定。
  # 所以再起一个只在 test profile 下的实例：同一个镜像、同一份 system.conf，
  # 只靠 containerd/patches/fay/0006-model-engine-env-overridable-CRLF-source.patch 放开的
  # FAY_GPT_MODEL_ENGINE / FAY_BIG_MODEL_ENGINE 换成 qwen2.5:1.5b（986MB，能整权重进显存，
  # 实测规划器 20.0s 冷 / 0.2s 暖，且守 {"action":"finish"...} 的 JSON 协议）。
  # 它只多占一份自己的卷，端口不映射到宿主机 —— 探针在 compose 网络上打它。
  fay-lite:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-fay-lite
    restart: "no"
    command: ["python", "main.py", "start"]
    environment:
      TZ: Asia/Shanghai
      <<: [*llm-timeouts, *llm-endpoint-lite]
      # 显式键优先于上面 merge 进来的同名词，这个次序不要反。
      FAY_GPT_MODEL_ENGINE: ${FAY_LITE_MODEL_ENGINE:-qwen2.5:1.5b}
      FAY_BIG_MODEL_ENGINE: ${FAY_LITE_MODEL_ENGINE:-qwen2.5:1.5b}
    volumes:
      # config.json 是「可写」的（数字人设定在控制台保存时会回写），不能和 dh-fay
      # 共用宿主机上同一个文件，所以 lite 有一份自己的副本。system.conf 是只读的，共用。
      - ./overlay/fay/system.conf:/app/system.conf:ro
      - ./overlay/fay-lite/config.json:/app/config.json
      - ./overlay/fay-lite/mcp_servers.json:/app/faymcp/data/mcp_servers.json
      # 与 dh-fay 同一套 prestart 配置（lite 那份 mcp_servers.json 里 yueshen 也是 id=4）。
      # 探针 probe-fay-lite 判的是「问答链路真的通」，它也必须走同一条知识库路径，
      # 否则绿的是另一条代码路径。
      - ./overlay/fay-lite/mcp_prestart_tools.json:/app/faymcp/data/mcp_prestart_tools.json
      - fay-lite-memory:/app/memory
      - fay-lite-cache:/app/cache_data
      - fay-lite-logs:/app/logs
      - fay-lite-samples:/app/samples
    healthcheck: *fay-healthcheck
    depends_on:
      redis:
        condition: service_started
      yueshen-rag:
        condition: service_started

  probe-fay-lite:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-fay-lite-probe
    restart: "no"
    working_dir: /app
    environment:
      # 探针的 check_llm_host 要直连「被测实例真正在用的那个模型」量下限耗时；
      # system.conf 里写的是 9b，lite 实例靠补丁换成 1.5b，所以这个开关两边都得给。
      FAY_GPT_MODEL_ENGINE: ${FAY_LITE_MODEL_ENGINE:-qwen2.5:1.5b}
      # 与被测实例同一份超时预算，否则 check_embedding 量的不是容器真正会走的那条路。
      # 端点同理，而且必须用 lite 那一份锚点：探针要量的就是「lite 实际在用哪个端点」，
      # 挂主实例的 &llm-endpoint 会在主实例端点搬走时，让探针去量一个实例根本没在用的端点。
      <<: [*llm-timeouts, *llm-endpoint-lite]
    volumes:
      - ./probes:/probe:ro
      - ./overlay/fay/system.conf:/app/system.conf:ro
      - ./overlay/fay-lite/config.json:/app/config.json:ro
    # 预算按轻模型给：轻模型答一句是秒级，这里的上限同时是「显存不足时不要死等」的止损。
    command: ["python", "/probe/fay_probe.py", "--base", "http://fay-lite:5000",
              "--timeout", "45", "--max-timeout", "180"]
    depends_on:
      fay-lite:
        condition: service_healthy

  # yueshen 知识库那条链（Fay 管理面 → MCP/SSE → chromadb → 宿主 ollama 嵌入）的端到端
  # 判据。打的是 fork 实例 :5010 —— 三台实例的「连不连得上」已经由各组探针里的
  # `MCP 现场连接离线服务器 yueshen rag` 判掉了，这里要证的「真灌进去、真查得回来」
  # 与实例无关，只需要一条真链路，所以只跑一次。
  # 排在全套最后：它要打宿主 ollama 的嵌入模型，而这台机器显存只够放一个模型。
  # 理由与判据细节见 probes/yueshen_probe.py 的 docstring 和 README「yueshen 知识库」。
  probe-yueshen:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-probe-yueshen
    restart: "no"
    working_dir: /app
    environment:
      <<: *llm-timeouts
    volumes:
      - ./probes:/probe:ro
      # 预检要读被测实例那份 system.conf 拿嵌入出口地址与模型名（check_embedding_source
      # 的取法：量的必须是容器真正在用的那个出口，不是探针另猜一个）
      - ./overlay/fay/system.conf:/app/system.conf:ro
      - ./overlay/fay/config.json:/app/config.json:ro
    command: ["python", "/probe/yueshen_probe.py", "--base", "http://fay:5000", "--timeout", "240"]
    depends_on:
      fay:
        condition: service_healthy
      yueshen-rag:
        condition: service_started

  # ------------------------------------------------ 科普语料入库 + 检索抽测（./run.sh kb）
  # 与 probe-yueshen 的区别在那份脚本的 docstring 里：那组测链路，这组测数据。
  # 只用标准库，所以不必借 dh-fay 那 1.1GB 镜像。
  #
  # 挂两个 profile："kb" 给 `./run.sh kb`（灌库动作，切片变了才跑），"test" 让它同时
  # 是 `./run.sh test` 的判据 —— 改 top_k / 改切片 / 改 prestart 的人从此有人拦着
  # （12 问 + 距离明细 + 反向对照）。代价讲明白：它每次都 reset 重嵌入 516 个片段，
  # 几分钟，还要把 qwen3-embedding 换进那唯一 16GB 显存（换入实测 70s 起），
  # 所以它在 run.sh 里排在**全套最后**，谁也不抢。
  # 为什么不做成「只查不灌」的轻量判据：probe-yueshen 会 `ingest_yueshen(reset=True)`
  # 把整个集合换成镜像里那 3 段合成语料（probes/yueshen_probe.py:202，它那步的条数
  # 对账必须靠 reset 才成立），于是一条排在它后面、只读现有向量的 KB 判据会永远红。
  # 这块向量库只有一个集合，谁碰都躲不开，所以判据必须自带灌库。
  kb-ingest:
    <<: [*host-gateway]
    profiles: ["kb", "test"]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-kb-ingest
    restart: "no"
    # 嵌入超时的真正落点在被测的 yueshen-rag 那份 env（YUESHEN_EMBED_TIMEOUT=180）；
    # 这个客户端只按 --timeout 900 等 Fay 把整批重嵌入做完。不挂 Fay 那套
    # *llm-timeouts 锚点：这里跑的是标准库脚本，没有 Fay 进程去读它。
    volumes:
      - ./probes:/probe:ro
    command: ["python", "/probe/kb_ingest.py", "--base", "http://fay:5000", "--timeout", "900"]
    depends_on:
      fay:
        condition: service_healthy
      yueshen-rag:
        condition: service_started

  # ------------------------------------------------ 知识库的业务判据（./run.sh kbq）
  # 上面那组走 :5010 管理面直调工具，证明的是「链路通、数据进得去」；这一组走
  # /api/send + /api/get-msg，取的是那一问的原始回帧 —— 也就是真实业务里用户能拿到
  # 的唯一东西。判据是「知识库的话有没有被注入、模型有没有用它回答」，那两条在
  # probes/kb_fay_probe.py 的 docstring 里。
  #
  # "kb" 是它的实际归属（`./run.sh kbq` 走这个 profile）；"test" 挂上只为让
  # `./run.sh test kb-fay` 那一串组名走得通（组循环写死了 `--profile test`）。
  # **它不在 DEFAULT_GROUPS 里**，常态全套不会跑到它。理由是代价：一组要发两整轮问答
  # （正常轮 + 摘掉 prestart 注册的对照轮），每轮都过一遍大模型。远端 26B 12s 一发，本机
  # 9b 权重只进 6% 显存时 172~301s，挂进常态清单就等于让 `./run.sh test` 在低配机器上必然
  # 卡在一条与回归无关的判据上。人发起用 `./run.sh kbq`。
  kb-fay:
    <<: [*host-gateway]
    profiles: ["kb", "test"]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-kb-fay
    restart: "no"
    volumes:
      - ./probes:/probe:ro
    command: ["python", "/probe/kb_fay_probe.py", "--base", "http://fay:5000", "--timeout", "520"]
    depends_on:
      fay:
        condition: service_healthy
      yueshen-rag:
        condition: service_started

  # ue/ 是 11GB 的 UE 工程：没有引擎本体、依赖 Marketplace 授权插件，无法在 Linux
  # 容器里"跑起来"。但它并非与容器无关 —— 这个只读挂载的体检容器给出可复核的事实
  # （有无 Source 模块、插件平台分布、是否引用 10002 数字人协议），
  # 把"为什么不能容器化"从印象变成输出。详见 README「UE 仓库的容器侧处置」。
  ue-audit:
    profiles: ["test"]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-ue-audit
    restart: "no"
    volumes:
      - ../ue:/ue:ro
      - ./probes:/probe:ro
      # 报告落到宿主机，README 引用的数字必须能对着文件复核
      - ./_audit:/out
    command: ["python", "/probe/ue_audit.py", "/ue", "--json", "/out/ue-audit.json"]

  # adapter 是本栈唯一新增的一跳（backend ↔ Fay 的协议翻译），它此前只有 `./run.sh smoke`
  # 一条端到端证据，而那条要过 9b —— 显存被占满时一发 172~301s，跑不跑得动取决于这台
  # 机器此刻忙不忙。这份契约测试把假 Fay 起在同一容器里、按真实启动方式跑 adapter 子进程，
  # 11 条判据与 LLM 无关，任何机器上都是秒级：不碰 ollama，也就不碰显存这条瓶颈。
  adapter-test:
    profiles: ["test"]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-adapter-test
    restart: "no"
    volumes:
      - ./adapter:/adapter:ro
      - ./probes:/probe:ro
    command: ["python", "/probe/adapter_test.py"]

  # 探针自己的收工时机自测。为什么要单开一组：check_ws() 里「这个会话可以收工了」
  # 的判据本身就会写错 —— run #10 的 audio 帧被误判成 FAIL，而同一份代码在 run #9 是
  # PASS。这类「因为被测对象的节奏而变红」的判据，如果只靠再跑 20 分钟全套去发现，
  # 下次改动就只能猜。这里用假 Fay 的 WS 服务端把五种时机各量一次，其中一条把窗口
  # 退回旧的 6s 并断言"必须收不到"（防止自测退化成摆设）。
  # 和被测的探针共用 dh-fay:local：它 import 的就是那份 fay_probe，也要跑在上游钉住的
  # websockets 10.4 上（宿主机那份是 16.x，两版 API 都得过）。不打 LLM、不出网。
  probe-selftest:
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-probe-selftest
    restart: "no"
    working_dir: /app
    volumes:
      - ./probes:/probe:ro
    command: ["python", "/probe/ws_timing_test.py"]

  # CareEcho 外壳的契约测试。跑在 dh-frontend:local 里，被测的就是镜像里那份
  # /app/carecho_web.py 和那份 npm run build 的产物，假后端起在同一容器（脚本内线程），
  # 所以这组不碰 backend、不碰 ollama —— 17 条判据在任何机器上都是秒级。
  # 最后一格是负面自检：把外壳的 Set-Cookie 改坏再跑，判据必须撑不住；撑得住就说明
  # 这套判据是摆设（probes/adapter_test.py 的同一条理由）。
  frontend-test:
    profiles: ["test"]
    image: dh-frontend:local
    container_name: dh-frontend-test
    restart: "no"
    entrypoint: ["python", "/probe/frontend_test.py"]
    volumes:
      - ./probes:/probe:ro

  # 外壳那段 stdlib WS 转发的契约测试。假上游与真客户端都起在同一容器里（脚本内线程），
  # 所以这组不碰 funasr、不碰网络：判的是「转发是不是中性的」—— 掩码帧原样过、首批 PCM
  # 不被 rfile 吞、表外路径不拨号、一侧关闭另一侧收尾。最后一格是负面自检，
  # 它必须能把上面某条判据弄红，否则那几条码是摆设（理由同 frontend-test 第 17 格）。
  ws-relay-test:
    profiles: ["test"]
    image: dh-frontend:local
    container_name: dh-ws-relay-test
    restart: "no"
    entrypoint: ["python", "/probe/ws_relay_test.py"]
    volumes:
      - ./probes:/probe:ro

  # 真栈冒烟：拿前端实际会发的那个请求形状，从外壳打进去穿完整条链
  # （外壳 → backend → adapter → Fay → 对话端点）。一条判据的开销全在最后那一问，
  # 本机 9b 冷启动实测 172~301s，所以它排在全套最后，理由与 probe-yueshen 相同。
  frontend-probe:
    <<: [*host-gateway]
    profiles: ["test"]
    image: docker.m.daocloud.io/python:3.12-slim
    container_name: dh-frontend-probe
    restart: "no"
    volumes:
      - ./probes:/probe:ro
    command: ["python", "/probe/frontend_probe.py", "--base", "http://frontend:8080", "--timeout", "600"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ASR 协议判据：脚本自己用 ASR_FAKE_MODEL=1 起一份 server.py 子进程（不加载 torch），
  # 所以这组在任何机器上都是秒级、且不需要真服务在跑。它判的四件事 —— 32000B 对齐切块、
  # 累计前缀、final 有且只有一个、并发两路不串线 —— 全部与模型无关，用假模型判最干净。
  asr-test:
    profiles: ["test"]
    image: dh-funasr:local
    container_name: dh-asr-test
    restart: "no"
    working_dir: /app
    entrypoint: ["python", "/probe/asr_test.py"]
    volumes:
      - ./probes:/probe:ro

  # 真模型 + 真语音那条（无麦）：把真人语音按浏览器节奏推给 dh-funasr，判它出不出字。
  # 跑在 dh-fay:local 而不是 dh-funasr:local —— 「已知原文」那条判据要现场合成，而 ASR
  # 镜像里故意不带 edge_tts（细节与判据见 probes/asr_probe.py 头部）。
  # 与 fay-probe 同样挂两份 overlay 配置：load_config() 找不到本地 system.conf 时会去连
  # 已下线的远程配置中心，光超时就要 150s。
  # 排在全套最后：它要 CPU 推理，而 torch 的线程数被压在 FUNASR_TORCH_THREADS=4，
  # 前面几组抢完 CPU 才轮到它，慢与降级都不等于坏。
  asr-probe:
    <<: [*host-gateway]
    profiles: ["test"]
    image: dh-fay:local
    container_name: dh-asr-probe
    restart: "no"
    working_dir: /app
    volumes:
      - ./probes:/probe:ro
      - ./overlay/fay/system.conf:/app/system.conf:ro
      - ./overlay/fay/config.json:/app/config.json:ro
      # 上游仓库自带的那段真人语音（15.26s / 16kHz 单声道，ASR 的原生格式）。
      # 只读挂，不写上游一个字。**故意不挂运行期的 fay-samples 卷**：fay/main.py:181
      # 的 __clear_samples() 每次启动都把 ./samples 清空，用它当输入 = 每轮必空。
      - ../fay/samples:/samples:ro
    command: ["python", "/probe/asr_probe.py", "--host", "funasr", "--port", "10095",
              "--samples", "/samples", "--timeout", "180"]
    depends_on:
      funasr:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  fay-memory:
  fay-cache:
  fay-logs:
  fay-samples:
  fay-lite-memory:
  fay-lite-cache:
  fay-lite-logs:
  fay-lite-samples:
  backend-data:
  # chromadb 的向量库。不挂 volume 也能跑（数据落在容器可写层），但那样每次重建实例
  # 都要重新 ingest 一遍语料 —— 而对本机来说一次 ingest 的代价主要是宿主 ollama 换入
  # 嵌入模型，不是写库。挂上之后这条判据不再依赖「上一轮灌过没有」。
  yueshen-persist:
  # FunASR 的模型缓存（约 1.3GB：paraformer-large 990MB + ct-punc 292MB + fsmn-vad）。
  # 这卷里全是公网可下的权重、不含任何数据，所以删掉重下是安全的；
  # 本机想免重下就 ./run.sh asr-seed 从伙伴方那个同名缓存卷拷一份过来。
  funasr-cache:
